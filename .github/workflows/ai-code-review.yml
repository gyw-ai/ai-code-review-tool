name: Topology Experiment CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  topology-experiment:
    runs-on: [self-hosted, linux, gpu]
    if: github.repository_owner == 'gyw-ai'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check environment
        run: |
          python check_setup.py

      - name: Run teacher labeling on changed files
        run: |
          python run_experiment.py --label 100 --compare demo.py

      - name: Train CNN/RNN/GNN paths
        run: |
          python run_experiment.py --train teacher_labels.json --epochs 5 --paths cnn rnn gnn

      - name: Compare all paths on demo.py
        run: |
          python -m src.topology_experiment review demo.py --mode compare

      - name: Archive trained models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: trained_models/
          retention-days: 30

  local-agent-review:
    runs-on: ubuntu-latest
    if: github.repository_owner != 'gyw-ai'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.py
            **/*.js
            **/*.ts

      - name: Run dual-agent review
        run: |
          python review_both.py \
            --files ${{ steps.changed-files.outputs.all_changed_files }} \
            --gpt-model deepseek-r1:7b \
            --claude-model qwen2.5-coder:7b